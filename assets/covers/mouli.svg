<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" aria-label="A mouli in a white shirt climbs toward a hanging bee comb in a mangrove tree, a mask is painted on the back of his head, smoke rises from a pot below, a tiger's eyes watch from the reeds at the water's edge.">
    <rect width="800" height="480" fill="#5C7AA8"></rect>
    <!-- sun -->
    <circle cx="660" cy="80" r="36" fill="#D4B86A" stroke="#1A1A1A" stroke-width="2.5"></circle>
    <line x1="660" y1="22" x2="660" y2="34" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></line>
    <line x1="720" y1="80" x2="708" y2="80" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></line>
    <line x1="600" y1="80" x2="612" y2="80" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></line>
    <!-- distant mangrove wall -->
    <path d="M0 240 Q60 200 120 230 Q180 200 240 235 Q300 205 360 230 Q420 200 480 235 Q540 205 600 230 Q660 200 720 235 Q780 205 800 230 L800 290 L0 290 Z" fill="#3F5E3B" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"></path>
    <!-- water -->
    <rect x="0" y="290" width="800" height="190" fill="#5C7AA8"></rect>
    <path d="M0 304 Q40 300 80 304 T160 304 T240 304 T320 304 T400 304 T480 304 T560 304 T640 304 T720 304 T800 304" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.5"></path>
    <path d="M0 326 Q40 322 80 326 T160 326 T240 326 T320 326 T400 326 T480 326 T560 326 T640 326 T720 326 T800 326" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.5"></path>
    <path d="M0 350 Q40 346 80 350 T160 350 T240 350 T320 350 T400 350 T480 350 T560 350 T640 350 T720 350 T800 350" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.5"></path>
    <!-- mangrove tree (front) -->
    <g transform="translate(220,90)">
      <!-- canopy -->
      <ellipse cx="80" cy="40" rx="120" ry="50" fill="#6FAEA8" stroke="#1A1A1A" stroke-width="3"></ellipse>
      <ellipse cx="20" cy="20" rx="50" ry="30" fill="#8A9978" stroke="#1A1A1A" stroke-width="3"></ellipse>
      <ellipse cx="140" cy="20" rx="55" ry="32" fill="#8A9978" stroke="#1A1A1A" stroke-width="3"></ellipse>
      <!-- trunk -->
      <path d="M70 80 Q66 130 60 200 Q60 240 80 290 M88 80 Q94 130 100 200 Q102 240 88 290" fill="#C6A27A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"></path>
      <!-- branch -->
      <path d="M76 90 Q100 100 130 110 Q150 116 170 130" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"></path>
      <!-- hanging comb -->
      <g transform="translate(168,134)">
        <path d="M-30 0 Q-32 8 -28 14 L-26 60 Q0 76 26 60 L28 14 Q32 8 30 0 Z" fill="#D4B86A" stroke="#1A1A1A" stroke-width="2.5"></path>
        <!-- hex pattern hint -->
        <g stroke="#1A1A1A" stroke-width="1" fill="none">
          <path d="M-20 22 L-12 18 L-4 22 L-4 30 L-12 34 L-20 30 Z"></path>
          <path d="M-4 22 L4 18 L12 22 L12 30 L4 34 L-4 30 Z"></path>
          <path d="M12 22 L20 18 L24 22"></path>
          <path d="M-20 38 L-12 34 L-4 38 L-4 46 L-12 50 L-20 46 Z"></path>
          <path d="M-4 38 L4 34 L12 38 L12 46 L4 50 L-4 46 Z"></path>
        </g>
        <!-- bees around comb -->
      </g>
      <g transform="translate(140,124)">
        <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#D4B86A" stroke="#1A1A1A" stroke-width="1.3"></ellipse>
        <line x1="-2" y1="-4" x2="-2" y2="4" stroke="#1A1A1A" stroke-width="1.2"></line>
        <line x1="2" y1="-4" x2="2" y2="4" stroke="#1A1A1A" stroke-width="1.2"></line>
        <ellipse cx="-3" cy="-4" rx="4" ry="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.9"></ellipse>
        <ellipse cx="3" cy="-4" rx="4" ry="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.9"></ellipse>
      </g>
      <g transform="translate(110,150) scale(0.85)">
        <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#D4B86A" stroke="#1A1A1A" stroke-width="1.3"></ellipse>
        <line x1="-2" y1="-4" x2="-2" y2="4" stroke="#1A1A1A" stroke-width="1.2"></line>
        <line x1="2" y1="-4" x2="2" y2="4" stroke="#1A1A1A" stroke-width="1.2"></line>
        <ellipse cx="-3" cy="-4" rx="4" ry="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.9"></ellipse>
        <ellipse cx="3" cy="-4" rx="4" ry="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.9"></ellipse>
      </g>
      <g transform="translate(214,164)">
        <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#D4B86A" stroke="#1A1A1A" stroke-width="1.3"></ellipse>
        <line x1="-2" y1="-4" x2="-2" y2="4" stroke="#1A1A1A" stroke-width="1.2"></line>
        <line x1="2" y1="-4" x2="2" y2="4" stroke="#1A1A1A" stroke-width="1.2"></line>
        <ellipse cx="-3" cy="-4" rx="4" ry="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.9"></ellipse>
        <ellipse cx="3" cy="-4" rx="4" ry="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.9"></ellipse>
      </g>
    </g>
    <!-- the mouli on a small boat reaching upward, with mask on BACK of head -->
    <g transform="translate(330,300)">
      <!-- country boat -->
      <path d="M-90 30 Q-70 50 0 52 Q70 50 90 30 L86 36 Q70 56 0 58 Q-70 56 -86 36 Z" fill="#8B6F47" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"></path>
      <path d="M-90 30 Q0 22 90 30" fill="none" stroke="#1A1A1A" stroke-width="2"></path>
      <!-- body -->
      <rect x="-14" y="-40" width="28" height="60" rx="6" fill="#F5EFE4" stroke="#1A1A1A" stroke-width="2.5"></rect>
      <!-- arm reaching up -->
      <path d="M-2 -40 Q-10 -70 -20 -90 Q-22 -110 -18 -120" fill="none" stroke="#F5DCC1" stroke-width="9" stroke-linecap="round"></path>
      <path d="M-2 -40 Q-10 -70 -20 -90 Q-22 -110 -18 -120" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"></path>
      <!-- head — BACK of head facing right toward tiger; mask painted ON the back -->
      <circle cx="0" cy="-52" r="14" fill="#F5DCC1" stroke="#1A1A1A" stroke-width="2.5"></circle>
      <!-- hair fringe -->
      <path d="M-14 -56 Q-10 -66 0 -66 Q10 -66 14 -56 L13 -50 Q0 -54 -13 -50 Z" fill="#1A1A1A"></path>
      <!-- the painted face/mask on the back of head -->
      <circle cx="-2" cy="-50" r="2.2" fill="#1A1A1A"></circle>
      <circle cx="6" cy="-50" r="2.2" fill="#1A1A1A"></circle>
      <path d="M-2 -44 Q2 -42 6 -44" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round"></path>
      <!-- label tag -->
      <g transform="translate(-160,-110)">
        <line x1="146" y1="62" x2="120" y2="40" stroke="#1A1A1A" stroke-width="1.5"></line>
        <rect x="0" y="20" width="118" height="42" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"></rect>
        <text x="59" y="36" text-anchor="middle" font-family="Archivo Black" font-size="9" fill="#1A1A1A">MASK ON THE BACK</text>
        <text x="59" y="50" text-anchor="middle" font-family="Caveat" font-size="13" fill="#1A1A1A">tigers ambush from behind</text>
      </g>
      <!-- smoke pot -->
      <g transform="translate(50,0)">
        <rect x="-12" y="0" width="24" height="20" rx="3" fill="#1A1A1A"></rect>
        <ellipse cx="0" cy="0" rx="14" ry="4" fill="#C6A27A" stroke="#1A1A1A" stroke-width="2"></ellipse>
        <!-- smoke -->
        <path d="M-6 -4 Q-12 -22 -2 -32 Q4 -42 -6 -56 Q-12 -66 -4 -78" fill="none" stroke="#F5EFE4" stroke-width="6" stroke-linecap="round" opacity="0.85"></path>
        <path d="M6 -4 Q14 -18 4 -28 Q-2 -38 6 -52" fill="none" stroke="#F5EFE4" stroke-width="5" stroke-linecap="round" opacity="0.7"></path>
      </g>
    </g>
    <!-- watching companion -->
    <g transform="translate(420,316)">
      <rect x="-10" y="-30" width="20" height="42" rx="4" fill="#F5EFE4" stroke="#1A1A1A" stroke-width="2"></rect>
      <circle cx="0" cy="-38" r="9" fill="#F5DCC1" stroke="#1A1A1A" stroke-width="2"></circle>
      <path d="M-9 -42 Q-6 -48 0 -48 Q6 -48 9 -42 L8 -38 Q0 -41 -8 -38 Z" fill="#1A1A1A"></path>
      <!-- stick -->
      <line x1="9" y1="-26" x2="32" y2="-58" stroke="#8B6F47" stroke-width="3" stroke-linecap="round"></line>
    </g>
    <!-- tiger eyes in the reeds, right side -->
    <g transform="translate(630,220)">
      <!-- reed cluster -->
      <path d="M-30 70 Q-30 30 -32 -10 M-18 70 Q-18 30 -16 -14 M-4 70 Q-4 26 -6 -18 M10 70 Q10 28 12 -12 M22 70 Q22 30 20 -8" stroke="#3F5E3B" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <!-- tiger head behind reeds -->
      <ellipse cx="0" cy="30" rx="40" ry="22" fill="#C68A4A" stroke="#1A1A1A" stroke-width="2.5"></ellipse>
      <!-- ears -->
      <path d="M-32 14 L-26 4 L-20 16 Z" fill="#C68A4A" stroke="#1A1A1A" stroke-width="2"></path>
      <path d="M32 14 L26 4 L20 16 Z" fill="#C68A4A" stroke="#1A1A1A" stroke-width="2"></path>
      <!-- stripes -->
      <path d="M-30 18 L-26 26" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M-20 12 L-18 22" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M20 12 L18 22" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M30 18 L26 26" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <!-- eyes -->
      <ellipse cx="-12" cy="28" rx="5" ry="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"></ellipse>
      <ellipse cx="12" cy="28" rx="5" ry="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"></ellipse>
      <circle cx="-12" cy="29" r="2.2" fill="#1A1A1A"></circle>
      <circle cx="12" cy="29" r="2.2" fill="#1A1A1A"></circle>
      <!-- nose & mouth -->
      <path d="M-4 36 L0 40 L4 36 Z" fill="#1A1A1A"></path>
      <path d="M0 40 Q-4 46 -8 44 M0 40 Q4 46 8 44" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"></path>
    </g>
    <!-- wordmark -->
    <g transform="translate(28,460)">
      <rect x="-4" y="-18" width="148" height="24" fill="#C7E34A" stroke="#1A1A1A" stroke-width="2"></rect>
      <text x="70" y="-1" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="16" fill="#1A1A1A">TRUTH BE TOLD</text>
    </g>
  </svg>