<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" aria-label="Three honey jars, all stamped NMR-tested, holding very different pieces of paper">
    <rect width="800" height="460" fill="#6FAEA8"></rect>
    <!-- floor line -->
    <line x1="20" y1="400" x2="780" y2="400" stroke="#1A1A1A" stroke-width="2.5"></line>
    <text x="60" y="58" font-family="Archivo Black" font-size="22" fill="#1A1A1A">ALL SAY</text>
    <text x="60" y="88" font-family="Archivo Black" font-size="22" fill="#1A1A1A">"NMR-TESTED"</text>
    <!-- Arrow -->
    <path d="M290 76 L350 76" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"></path>
    <path d="M342 70 L352 76 L342 82" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>
    <text x="370" y="82" font-family="Caveat" font-size="28" fill="#1A1A1A">mean very different things.</text>

    <!-- JAR 1: Level 1 Ã¢â‚¬â€ holds scribbled self-certificate -->
    <g transform="translate(110,180)">
      <path d="M10 30 Q10 10 30 10 L90 10 Q110 10 110 30 L110 210 Q110 220 100 220 L20 220 Q10 220 10 210 Z" fill="#E8C27C" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"></path>
      <rect x="5" y="0" width="110" height="18" rx="3" fill="#1A1A1A"></rect>
      <!-- face -->
      <circle cx="45" cy="55" r="4" fill="#1A1A1A"></circle>
      <circle cx="75" cy="55" r="4" fill="#1A1A1A"></circle>
      <path d="M46 72 Q60 66 74 72" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"></path>
      <!-- NMR stamp on chest -->
      <rect x="25" y="95" width="70" height="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" transform="rotate(-4 60 109)"></rect>
      <text x="60" y="114" text-anchor="middle" font-family="Archivo Black" font-size="11" fill="#1A1A1A" transform="rotate(-4 60 109)">NMR-TESTED</text>
      <!-- arms holding scribbled paper -->
      <path d="M10 150 Q-10 170 0 200" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M110 150 Q130 170 120 200" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <!-- scribbled paper -->
      <rect x="15" y="155" width="90" height="55" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"></rect>
      <path d="M22 168 Q35 163 50 168 T80 168 Q90 165 97 168" fill="none" stroke="#1A1A1A" stroke-width="1.5"></path>
      <path d="M22 180 Q35 175 50 180 T80 180 Q90 177 97 180" fill="none" stroke="#1A1A1A" stroke-width="1.5"></path>
      <path d="M22 192 Q40 187 60 192 T95 192" fill="none" stroke="#1A1A1A" stroke-width="1.5"></path>
      <!-- tag under: tested by... us -->
      <ellipse cx="60" cy="245" rx="50" ry="5" fill="#1A1A1A" opacity="0.4"></ellipse>
      <text x="60" y="282" text-anchor="middle" font-family="Caveat" font-size="20" font-weight="700" fill="#1A1A1A">tested by... us.</text>
    </g>

    <!-- JAR 2: Level 2 Ã¢â‚¬â€ holds one old certificate with cobwebs/date -->
    <g transform="translate(340,180)">
      <path d="M10 30 Q10 10 30 10 L90 10 Q110 10 110 30 L110 210 Q110 220 100 220 L20 220 Q10 220 10 210 Z" fill="#D9A868" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"></path>
      <rect x="5" y="0" width="110" height="18" rx="3" fill="#1A1A1A"></rect>
      <circle cx="45" cy="55" r="4" fill="#1A1A1A"></circle>
      <circle cx="75" cy="55" r="4" fill="#1A1A1A"></circle>
      <!-- flat line mouth -->
      <line x1="46" y1="72" x2="74" y2="72" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"></line>
      <rect x="25" y="95" width="70" height="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" transform="rotate(3 60 109)"></rect>
      <text x="60" y="114" text-anchor="middle" font-family="Archivo Black" font-size="11" fill="#1A1A1A" transform="rotate(3 60 109)">NMR-TESTED</text>
      <!-- certificate with seal -->
      <rect x="15" y="155" width="90" height="60" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"></rect>
      <text x="60" y="170" text-anchor="middle" font-family="Archivo Black" font-size="8" fill="#1A1A1A">CERTIFICATE</text>
      <line x1="22" y1="180" x2="98" y2="180" stroke="#1A1A1A" stroke-width="1"></line>
      <line x1="22" y1="188" x2="98" y2="188" stroke="#1A1A1A" stroke-width="1"></line>
      <text x="22" y="206" font-family="Caveat" font-size="11" fill="#1A1A1A">dated: 2024</text>
      <!-- seal -->
      <circle cx="88" cy="202" r="9" fill="#C7E34A" stroke="#1A1A1A" stroke-width="1.5"></circle>
      <text x="88" y="205" text-anchor="middle" font-family="Archivo Black" font-size="6" fill="#1A1A1A">OK</text>
      <!-- arms -->
      <path d="M10 150 Q-10 170 0 200" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M110 150 Q130 170 120 200" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <ellipse cx="60" cy="245" rx="50" ry="5" fill="#1A1A1A" opacity="0.4"></ellipse>
      <text x="60" y="282" text-anchor="middle" font-family="Caveat" font-size="20" font-weight="700" fill="#1A1A1A">one old report.</text>
    </g>

    <!-- JAR 3: Level 3 Ã¢â‚¬â€ holds stack of dated reports with QR code -->
    <g transform="translate(570,180)">
      <path d="M10 30 Q10 10 30 10 L90 10 Q110 10 110 30 L110 210 Q110 220 100 220 L20 220 Q10 220 10 210 Z" fill="#C68A4A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"></path>
      <rect x="5" y="0" width="110" height="18" rx="3" fill="#1A1A1A"></rect>
      <!-- happy face -->
      <circle cx="45" cy="55" r="4" fill="#1A1A1A"></circle>
      <circle cx="75" cy="55" r="4" fill="#1A1A1A"></circle>
      <circle cx="44" cy="54" r="1.2" fill="#FFF"></circle>
      <circle cx="74" cy="54" r="1.2" fill="#FFF"></circle>
      <path d="M42 70 Q60 82 78 70" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <rect x="25" y="95" width="70" height="28" fill="#C7E34A" stroke="#1A1A1A" stroke-width="2"></rect>
      <text x="60" y="114" text-anchor="middle" font-family="Archivo Black" font-size="11" fill="#1A1A1A">NMR-TESTED</text>
      <!-- QR code -->
      <rect x="20" y="155" width="34" height="34" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"></rect>
      <rect x="24" y="159" width="6" height="6" fill="#1A1A1A"></rect>
      <rect x="44" y="159" width="6" height="6" fill="#1A1A1A"></rect>
      <rect x="24" y="179" width="6" height="6" fill="#1A1A1A"></rect>
      <rect x="32" y="167" width="4" height="4" fill="#1A1A1A"></rect>
      <rect x="38" y="173" width="4" height="4" fill="#1A1A1A"></rect>
      <rect x="44" y="179" width="6" height="6" fill="#1A1A1A"></rect>
      <rect x="38" y="183" width="4" height="4" fill="#1A1A1A"></rect>
      <!-- stack of reports -->
      <rect x="62" y="180" width="42" height="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"></rect>
      <rect x="60" y="172" width="42" height="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"></rect>
      <rect x="58" y="164" width="42" height="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"></rect>
      <rect x="56" y="156" width="42" height="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"></rect>
      <line x1="62" y1="160" x2="92" y2="160" stroke="#1A1A1A" stroke-width="0.8"></line>
      <line x1="62" y1="168" x2="92" y2="168" stroke="#1A1A1A" stroke-width="0.8"></line>
      <line x1="62" y1="176" x2="92" y2="176" stroke="#1A1A1A" stroke-width="0.8"></line>
      <line x1="62" y1="184" x2="92" y2="184" stroke="#1A1A1A" stroke-width="0.8"></line>
      <path d="M10 150 Q-10 170 0 200" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M110 150 Q130 170 120 200" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"></path>
      <ellipse cx="60" cy="245" rx="50" ry="5" fill="#1A1A1A" opacity="0.4"></ellipse>
      <text x="60" y="282" text-anchor="middle" font-family="Caveat" font-size="20" font-weight="700" fill="#1A1A1A">every batch. scan it.</text>
    </g>

    <!-- wordmark -->
    <g transform="translate(30,430)">
      <rect x="-4" y="-18" width="148" height="24" fill="#C7E34A" stroke="#1A1A1A" stroke-width="2"></rect>
      <text x="70" y="-1" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="16" fill="#1A1A1A">TRUTH BE TOLD</text>
    </g>
  </svg>